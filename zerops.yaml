# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yml-json-schema.json
# Service creation and public access remain deliberate Zerops console/import steps.
# This file configures builds and deploys; it does not auto-deploy or contain secrets.
zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - dist
        - fixtures
        - node_modules
        - package.json
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /readyz
    run:
      base: nodejs@22
      ports:
        - port: 3000
          protocol: TCP
          httpSupport: true
      envVariables:
        NODE_ENV: production
        HOST: 0.0.0.0
        PORT: "3000"
        DATABASE_URL: ${db_connectionString}
      start: npm run start:api
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz
        failureTimeout: 60
        disconnectTimeout: 30
        recoveryTimeout: 30
        execPeriod: 10

  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - dist
        - fixtures
        - node_modules
        - package.json
    deploy:
      readinessCheck:
        httpGet:
          port: 3001
          path: /readyz
    run:
      base: nodejs@22
      ports:
        - port: 3001
          protocol: TCP
          httpSupport: true
      envVariables:
        NODE_ENV: production
        HOST: 0.0.0.0
        DATABASE_URL: ${db_connectionString}
        OPENFDA_FIXTURE_PATH: fixtures/openfda/H-1180-2026.json
        WORKER_HEALTH_PORT: "3001"
      start: npm run start:worker
      healthCheck:
        httpGet:
          port: 3001
          path: /healthz
        failureTimeout: 60
        disconnectTimeout: 30
        recoveryTimeout: 30
        execPeriod: 10
